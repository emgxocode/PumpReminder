<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PumpLog</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #eeeeee;
            --delete-color: #ff4d4d;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #ffffff;
            --border-color: #333333;
            --delete-color: #ff6666;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            display: flex; flex-direction: column; align-items: center; 
            padding: 20px; margin: 0; min-height: 100vh;
            transition: background 0.3s ease;
        }

        .kiona {
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: 200;
        }

        .deco { position: absolute; z-index: -1; opacity: 0.1; font-size: 3rem; pointer-events: none; }
        .light-only { display: block; }
        .dark-only { display: none; }
        [data-theme="dark"] .light-only { display: none; }
        [data-theme="dark"] .dark-only { display: block; }

        .theme-switch { margin-bottom: 40px; align-self: flex-end; font-size: 0.7rem; letter-spacing: 2px; cursor: pointer; }
        
        .card { text-align: center; width: 100%; max-width: 340px; padding-bottom: 40px; }
        h1 { font-size: 1.4rem; margin-bottom: 50px; }

        .label { font-size: 0.7rem; letter-spacing: 3px; margin-bottom: 12px; margin-top: 25px; font-weight: 600; text-transform: uppercase; }

        input { 
            width: 100%; padding: 15px 0; border: none; border-bottom: 1px solid var(--border-color);
            background: transparent; color: var(--text-color);
            font-family: 'Montserrat', sans-serif; text-align: center; font-size: 1.2rem;
            border-radius: 0; outline: none;
        }

        button.main-btn { 
            background: var(--text-color); color: var(--bg-color); border: none; 
            padding: 22px; width: 100%; margin-top: 50px; cursor: pointer;
            transition: opacity 0.2s;
        }

        .history-section { width: 100%; max-width: 340px; margin-top: 20px; flex-grow: 1; }
        .history-item { 
            padding: 20px 0; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .item-left { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
        .item-right { text-align: right; margin-right: 15px; }
        
        .val-main { font-weight: 600; font-size: 1rem; }
        .val-sub { font-size: 0.65rem; letter-spacing: 1.5px; opacity: 0.5; text-transform: uppercase; }

        /* Individual Delete Style */
        .del-text {
            color: var(--delete-color);
            font-size: 0.6rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 600;
            padding: 5px;
        }

        .footer { margin-top: 60px; padding-bottom: 40px; text-align: center; width: 100%; }
        .clear-btn { 
            background: none; border: none; color: var(--text-color); 
            opacity: 0.3; font-size: 0.6rem; letter-spacing: 2px; 
            cursor: pointer; text-transform: uppercase; 
        }

    </style>
</head>
<body data-theme="light">

    <div class="deco light-only" style="top: 5%; left: 10%;">☀️</div>
    <div class="deco light-only" style="bottom: 15%; right: 10%;">☀️</div>
    <div class="deco dark-only" style="top: 10%; right: 15%;">✨</div>
    <div class="deco dark-only" style="bottom: 10%; left: 10%;">⭐</div>

    <div class="theme-switch" onclick="toggleTheme()">
        <span id="themeLabel">NIGHT MODE 🌙</span>
    </div>

    <div class="card">
        <h1 class="kiona">Pump Timer</h1>

        <div class="label">Time Pumped (Mins)</div>
        <input type="number" id="duration" placeholder="0" inputmode="numeric">

        <div class="label">Amount Produced (Oz)</div>
        <input type="number" id="volume" placeholder="0.0" step="0.5" inputmode="decimal">

        <button class="main-btn kiona" onclick="logSession()">Confirm</button>
    </div>

    <div class="history-section">
        <div class="label" style="margin-bottom: 20px; opacity: 0.4;">Recent History</div>
        <div id="historyList"></div>
    </div>

    <div class="footer">
        <button class="clear-btn kiona" onclick="clearHistory()">Clear History</button>
    </div>

<script>
    function toggleTheme() {
        const body = document.body;
        const current = body.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        body.setAttribute('data-theme', next);
        document.getElementById('themeLabel').innerText = next === 'light' ? 'NIGHT MODE 🌙' : 'LIGHT MODE ☀️';
        localStorage.setItem('pumpTheme', next);
    }

    const savedTheme = localStorage.getItem('pumpTheme');
    if(savedTheme) {
        document.body.setAttribute('data-theme', savedTheme);
        document.getElementById('themeLabel').innerText = savedTheme === 'light' ? 'NIGHT MODE 🌙' : 'LIGHT MODE ☀️';
    }

    function logSession() {
        const duration = document.getElementById('duration').value;
        const volume = document.getElementById('volume').value;
        if(!duration || !volume) return;

        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const dateStr = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });

        const entry = { id: Date.now(), date: dateStr, time: timeStr, duration: duration, amount: volume };
        let history = JSON.parse(localStorage.getItem('pumpLogs')) || [];
        history.unshift(entry);
        localStorage.setItem('pumpLogs', JSON.stringify(history.slice(0, 10)));

        document.getElementById('duration').value = "";
        document.getElementById('volume').value = "";
        displayHistory();
    }

    function deleteEntry(id) {
        let history = JSON.parse(localStorage.getItem('pumpLogs')) || [];
        history = history.filter(item => item.id !== id);
        localStorage.setItem('pumpLogs', JSON.stringify(history));
        displayHistory();
    }

    function displayHistory() {
        const history = JSON.parse(localStorage.getItem('pumpLogs')) || [];
        const list = document.getElementById('historyList');
        list.innerHTML = history.length ? history.map(item => `
            <div class="history-item">
                <div class="item-left">
                    <span class="val-main">${item.amount} OZ</span>
                    <span class="val-sub">${item.date} • ${item.time}</span>
                </div>
                <div class="item-right">
                    <span class="val-main">${item.duration} MIN</span>
                </div>
                <div class="del-text" onclick="deleteEntry(${item.id})">Delete</div>
            </div>
        `).join('') : '<p style="font-size:0.7rem; opacity:0.3; text-align:center; margin-top:20px;">No sessions logged yet.</p>';
    }

    function clearHistory() {
        if(confirm("Are you sure you want to clear all history?")) {
            localStorage.removeItem('pumpLogs');
            displayHistory();
        }
    }

    displayHistory();
</script>
</body>
</html>
