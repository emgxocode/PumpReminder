<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PumpLog</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #eeeeee;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #ffffff;
            --border-color: #333333;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            display: flex; flex-direction: column; align-items: center; 
            padding: 20px; margin: 0; min-height: 100vh;
        }

        .kiona {
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: 200;
        }

        /* Decorative Elements */
        .deco { position: absolute; z-index: -1; opacity: 0.1; font-size: 3rem; pointer-events: none; }
        .light-only { display: block; }
        .dark-only { display: none; }
        [data-theme="dark"] .light-only { display: none; }
        [data-theme="dark"] .dark-only { display: block; }

        .theme-switch { margin-bottom: 30px; align-self: flex-end; font-size: 0.7rem; letter-spacing: 2px; cursor: pointer; }
        
        .card { 
            text-align: center; width: 100%; max-width: 340px; 
            padding-bottom: 30px; border-bottom: 1px solid var(--border-color);
        }

        h1 { font-size: 1.4rem; margin-bottom: 40px; }

        .label { font-size: 0.7rem; letter-spacing: 3px; margin-bottom: 12px; margin-top: 25px; font-weight: 600; text-transform: uppercase; }

        input, select { 
            width: 80%; padding: 12px; border: 1px solid var(--border-color); 
            background: transparent; color: var(--text-color);
            font-family: 'Montserrat', sans-serif; text-align: center; font-size: 1rem;
            border-radius: 0;
        }

        button.main-btn { 
            background: var(--text-color); color: var(--bg-color); border: none; 
            padding: 20px; width: 100%; margin-top: 40px; cursor: pointer;
            transition: opacity 0.2s;
        }

        .history-section { width: 100%; max-width: 340px; margin-top: 30px; }
        .history-item { 
            padding: 20px 0; border-bottom: 1px dotted var(--border-color);
            display: flex; flex-direction: column; gap: 5px;
        }
        .item-main { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem; }
        .item-sub { font-size: 0.7rem; letter-spacing: 1px; opacity: 0.6; text-transform: uppercase; }

    </style>
</head>
<body data-theme="light">

    <div class="deco light-only" style="top: 5%; left: 10%;">☀️</div>
    <div class="deco light-only" style="bottom: 15%; right: 10%;">☀️</div>
    <div class="deco dark-only" style="top: 10%; right: 15%;">✨</div>
    <div class="deco dark-only" style="bottom: 10%; left: 10%;">⭐</div>

    <div class="theme-switch" onclick="toggleTheme()">
        <span id="themeLabel">NIGHT MODE 🌙</span>
    </div>

    <div class="card">
        <h1 class="kiona">Pump Timer</h1>

        <div class="label">Duration (Mins)</div>
        <input type="number" id="duration" placeholder="e.g. 20" inputmode="numeric">

        <div class="label">Amount (Oz)</div>
        <input type="number" id="volume" placeholder="e.g. 4.5" step="0.5" inputmode="decimal">

        <button class="main-btn kiona" onclick="logSession()">I Just Pumped!</button>
    </div>

    <div class="history-section">
        <div class="label" style="margin-top: 0; margin-bottom: 20px;">Recent Sessions</div>
        <div id="historyList"></div>
    </div>

<script>
    function toggleTheme() {
        const body = document.body;
        const current = body.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        body.setAttribute('data-theme', next);
        document.getElementById('themeLabel').innerText = next === 'light' ? 'NIGHT MODE 🌙' : 'LIGHT MODE ☀️';
        localStorage.setItem('pumpTheme', next);
    }

    // Load saved theme
    const savedTheme = localStorage.getItem('pumpTheme');
    if(savedTheme) {
        document.body.setAttribute('data-theme', savedTheme);
        document.getElementById('themeLabel').innerText = savedTheme === 'light' ? 'NIGHT MODE 🌙' : 'LIGHT MODE ☀️';
    }

    function logSession() {
        const duration = document.getElementById('duration').value;
        const volume = document.getElementById('volume').value;

        if(!duration || !volume) {
            alert("Please enter both duration and amount.");
            return;
        }

        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const dateStr = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });

        const entry = {
            date: dateStr,
            time: timeStr,
            duration: duration,
            amount: volume
        };

        let history = JSON.parse(localStorage.getItem('pumpLogs')) || [];
        history.unshift(entry);
        localStorage.setItem('pumpLogs', JSON.stringify(history.slice(0, 10)));

        // Reset fields
        document.getElementById('duration').value = "";
        document.getElementById('volume').value = "";
        
        displayHistory();
    }

    function displayHistory() {
        const history = JSON.parse(localStorage.getItem('pumpLogs')) || [];
        const list = document.getElementById('historyList');
        list.innerHTML = history.map(item => `
            <div class="history-item">
                <div class="item-main">
                    <span>${item.amount} OZ</span>
                    <span>${item.duration} MINS</span>
                </div>
                <div class="item-sub">${item.date} • ${item.time}</div>
            </div>
        `).join('');
    }

    displayHistory();
</script>
</body>
</html>
