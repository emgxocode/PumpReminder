<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PumpLog</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #eeeeee;
            --delete-color: #ff4d4d;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #ffffff;
            --border-color: #333333;
            --delete-color: #ff6666;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            display: flex; flex-direction: column; align-items: center; 
            padding: 20px; margin: 0; min-height: 100vh;
            transition: background 0.3s ease;
        }

        .kiona { text-transform: uppercase; letter-spacing: 5px; font-weight: 200; }

        /* Navigation */
        .nav-bar { width: 100%; max-width: 340px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-item { font-size: 0.65rem; letter-spacing: 2px; cursor: pointer; opacity: 0.4; transition: 0.3s; }
        .nav-item.active { opacity: 1; font-weight: 600; }

        .deco { position: absolute; z-index: -1; opacity: 0.1; font-size: 3rem; pointer-events: none; }
        .light-only { display: block; }
        .dark-only { display: none; }
        [data-theme="dark"] .light-only { display: none; }
        [data-theme="dark"] .dark-only { display: block; }

        /* Pages */
        .page { display: none; width: 100%; max-width: 340px; text-align: center; }
        .page.active { display: block; }

        .label { font-size: 0.7rem; letter-spacing: 3px; margin-bottom: 12px; margin-top: 25px; font-weight: 600; text-transform: uppercase; }

        input, select { 
            width: 100%; padding: 15px 0; border: none; border-bottom: 1px solid var(--border-color);
            background: transparent; color: var(--text-color);
            font-family: 'Montserrat', sans-serif; text-align: center; font-size: 1.2rem;
            border-radius: 0; outline: none;
        }

        .picker-group { display: flex; gap: 10px; align-items: center; justify-content: center; }
        .picker-group select { width: 80px; }

        button.main-btn { 
            background: var(--text-color); color: var(--bg-color); border: none; 
            padding: 22px; width: 100%; margin-top: 50px; cursor: pointer;
        }

        .history-item { padding: 20px 0; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .val-main { font-weight: 600; font-size: 1rem; }
        .val-sub { font-size: 0.65rem; letter-spacing: 1.5px; opacity: 0.5; text-transform: uppercase; }
        .del-text { color: var(--delete-color); font-size: 0.6rem; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; font-weight: 600; padding: 5px; }

        #reminderStatus { margin-top: 30px; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; }

        .footer { margin-top: 60px; padding-bottom: 40px; text-align: center; width: 100%; }
        .clear-btn { background: none; border: none; color: var(--text-color); opacity: 0.3; font-size: 0.6rem; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body data-theme="light">

    <div class="deco light-only" style="top: 5%; left: 10%;">☀️</div>
    <div class="deco dark-only" style="top: 10%; right: 15%;">✨</div>

    <div class="nav-bar">
        <div class="nav-links kiona">
            <span class="nav-item active" id="btn-log" onclick="showPage('log')">Log</span>
            <span class="nav-item" id="btn-remind" onclick="showPage('remind')">Remind</span>
        </div>
        <div class="nav-item kiona" onclick="toggleTheme()" id="themeLabel">🌙</div>
    </div>

    <!-- LOG PAGE -->
    <div id="page-log" class="page active">
        <h1 class="kiona" style="font-size: 1.4rem; margin-bottom: 50px;">Pump Log</h1>
        <div class="label">Time Pumped (Mins)</div>
        <input type="number" id="duration" placeholder="0" inputmode="numeric">
        <div class="label">Amount Produced (Oz)</div>
        <input type="number" id="volume" placeholder="0.0" step="0.5" inputmode="decimal">
        <button class="main-btn kiona" onclick="logSession()">Confirm</button>

        <div class="label" style="margin-top: 60px; margin-bottom: 20px; opacity: 0.4;">Recent History</div>
        <div id="historyList"></div>
    </div>

    <!-- REMINDER PAGE -->
    <div id="page-remind" class="page">
        <h1 class="kiona" style="font-size: 1.4rem; margin-bottom: 50px;">Reminder</h1>
        <div class="label">Remind me in</div>
        <div class="picker-group">
            <select id="rem-hours"></select><span>HR</span>
            <select id="rem-mins"></select><span>MIN</span>
        </div>
        <button class="main-btn kiona" onclick="setReminder()">Set Reminder</button>
        <div id="reminderStatus" class="kiona"></div>
    </div>

    <div class="footer">
        <button class="clear-btn kiona" onclick="clearHistory()">Clear History</button>
    </div>

<script>
    // Setup Dropdowns
    const hSel = document.getElementById('rem-hours');
    const mSel = document.getElementById('rem-mins');
    for(let i=0; i<=12; i++) hSel.innerHTML += `<option value="${i}" ${i===3?'selected':''}>${i}</option>`;
    for(let i=0; i<60; i+=15) mSel.innerHTML += `<option value="${i}">${i}</option>`;

    function showPage(pageName) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById('page-' + pageName).classList.add('active');
        document.getElementById('btn-' + pageName).classList.add('active');
    }

    function toggleTheme() {
        const next = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.body.setAttribute('data-theme', next);
        document.getElementById('themeLabel').innerText = next === 'light' ? '🌙' : '☀️';
        localStorage.setItem('pumpTheme', next);
    }

    function logSession() {
        const dur = document.getElementById('duration').value;
        const vol = document.getElementById('volume').value;
        if(!dur || !vol) return;
        const now = new Date();
        const entry = { id: Date.now(), date: now.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'}), time: now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), duration: dur, amount: vol };
        let history = JSON.parse(localStorage.getItem('pumpLogs')) || [];
        history.unshift(entry);
        localStorage.setItem('pumpLogs', JSON.stringify(history.slice(0, 10)));
        document.getElementById('duration').value = ""; document.getElementById('volume').value = "";
        displayHistory();
    }

    function displayHistory() {
        const history = JSON.parse(localStorage.getItem('pumpLogs')) || [];
        document.getElementById('historyList').innerHTML = history.map(item => `
            <div class="history-item">
                <div style="display:flex; flex-direction:column; gap:4px; flex-grow:1;">
                    <span class="val-main">${item.amount} OZ</span>
                    <span class="val-sub">${item.date} • ${item.time}</span>
                </div>
                <div style="text-align:right; margin-right:15px;"><span class="val-main">${item.duration} MIN</span></div>
                <div class="del-text" onclick="deleteEntry(${item.id})">Delete</div>
            </div>`).join('');
    }

    function deleteEntry(id) {
        let history = JSON.parse(localStorage.getItem('pumpLogs')) || [].filter(i => i.id !== id);
        localStorage.setItem('pumpLogs', JSON.stringify(history.filter(i => i.id !== id)));
        displayHistory();
    }

    function setReminder() {
        const h = parseInt(hSel.value);
        const m = parseInt(mSel.value);
        const targetTime = Date.now() + (h * 3600000) + (m * 60000);
        localStorage.setItem('nextPumpTime', targetTime);
        updateReminderUI();
    }

    function updateReminderUI() {
        const target = localStorage.getItem('nextPumpTime');
        const statusDiv = document.getElementById('reminderStatus');
        if(target) {
            const date = new Date(parseInt(target));
            statusDiv.innerText = `NEXT PUMP AT ${date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
        }
    }

    function clearHistory() { if(confirm("Clear all?")) { localStorage.removeItem('pumpLogs'); displayHistory(); } }

    // Init
    const savedTheme = localStorage.getItem('pumpTheme');
    if(savedTheme) { document.body.setAttribute('data-theme', savedTheme); document.getElementById('themeLabel').innerText = savedTheme === 'light' ? '🌙' : '☀️'; }
    displayHistory();
    updateReminderUI();
</script>
</body>
</html>
